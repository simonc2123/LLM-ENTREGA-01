[project]
name = "smurfit-agente-backend"
version = "0.1.0"
description = "Backend FastAPI del agente conversacional con router de tools (RAG + datos estructurados)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "langchain>=0.3.7,<1.0.0",
    "langchain-core>=0.3.0,<1.0.0",
    "langchain-openai>=0.2.5,<1.0.0",
    "langchain-ollama>=0.2.0,<1.0.0",
    "langchain-google-genai>=2.0.0,<3.0.0",
    "langchain-community>=0.3.5,<1.0.0",
    "faiss-cpu>=1.7.4,<1.13.0",
    "google-genai>=1.0.0",
]
