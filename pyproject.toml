[project]
name = "carton-colombia-scraper"
version = "0.1.0"
description = "Extracción completa del sitio oficial de Cartón de Colombia para alimentar modelos de IA"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "streamlit>=1.35.0",
    "ollama>=0.4.0",
    "langchain>=1.2.15",
    "langchain-ollama>=1.1.0",
    "langchain-community>=0.4.1",
    "faiss-cpu>=1.7.4,<1.13.0",
    "langchain-google-genai>=2.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = []
